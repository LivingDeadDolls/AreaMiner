help.1=範囲破壊: {0}で OFF → 平面 → 立体 → 階段 → 整地 → OFF（Fabric MOD導入時はMODの切り替えキー）
help.2=モード切り替え: /areaminer plane | cube | stairs | flatten | next | off ／ 現在の設定: /areaminer status
help.3=範囲も指定（そのモードに切り替え）: /areaminer plane 3 または plane 幅 高さ ／ cube 3 または cube 幅 高さ 奥行き（各1～10、1×1は不可）
help.4=階段: /areaminer stairs 幅 高さ 段数（幅1～10・高さ2～10・段数1～10）
help.7=整地: /areaminer flatten 5 または flatten 幅 奥行き 高さ（各1～10）。足元の高さから上を、空気をはさんでも高さ分まで掘ります（足元より低い所を掘ったときはその高さから）
help.6=鉱石: モードON中にその鉱石をドロップできるツールで掘ると、範囲の代わりにつながった同じ鉱石（斜めの接触も含む）をまとめて掘ります
help.5=個人設定: /areaminer highlight on|off ／ color 色の名前|gaming [速さ1～8]|#RRGGBB ／ drops feet|block ／ durability normal|half|none ／ tools all（ツール5種）|0～127

