help.1=Area mining: {0} cycles OFF → Plane → Cube → Stairs → Flatten → OFF (with the Fabric mod: its cycle key)
help.2=Mode: /areaminer plane | cube | stairs | flatten | next | off / current settings: /areaminer status
help.3=With a range (also switches mode): /areaminer plane 3 or plane <width> <height> / cube 3 or cube <width> <height> <depth> (1-10 each, not 1×1)
help.4=Stairs: /areaminer stairs <width> <height> <steps> (width 1-10, height 2-10, steps 1-10)
help.7=Flatten: /areaminer flatten 5 or flatten <width> <depth> <height> (1-10 each). Clears everything from your feet up to the height, through air gaps too (from the broken block if it is lower than your feet)
help.6=Ores: with a mode on, mining an ore with a tool that can harvest it takes the whole connected vein (diagonal contact included) instead of the area
help.5=Options: /areaminer highlight on|off / color <name>|gaming [speed 1-8]|#RRGGBB / drops feet|block / durability normal|half|none / tools all (the five tools)|0-127

